name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION=${GITHUB_REF_NAME#v}
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $TAG_VERSION does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi

      # ----------------------------------------------------------------------
      # npm publish is DELIBERATELY OMITTED from this workflow.
      #
      # We attempted OIDC Trusted Publishing (tags v0.1.1, v0.1.2, v0.1.4) and
      # every attempt failed with a masked 404 on the package PUT, despite:
      #   - GitHub Actions OIDC token claims being verifiably correct
      #     (repository: Tethral-Inc/homebridge-tethral, workflow_ref matches)
      #   - npm accepting the same OIDC token at the Sigstore provenance
      #     endpoint in the same publish call
      # The trusted publisher record on npm.com is configured with the exact
      # owner/repo/workflow values that match the OIDC claims. This is an
      # npm-side issue (suspected trusted-publisher record state for newly
      # created orgs, or 2FA-vs-OIDC interaction). Tracked with npm support;
      # not solvable from our side.
      #
      # Until resolved, the maintainer runs `npm publish` from a local clone
      # after the release tag lands. The local CLI authenticates with a
      # short-lived Granular Access Token + WebAuthn passkey (the npm account
      # has passkey-only 2FA).
      #
      # When OIDC is fixed, restore the publish step:
      #   - name: Publish to npm with provenance
      #     run: npm publish --access public --provenance
      # ----------------------------------------------------------------------

      - name: Generate release notes from commits since previous tag
        id: notes
        run: |
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          {
            echo 'body<<NOTES_EOF'
            if [ -n "$PREV" ]; then
              echo "## Changes since $PREV"
              echo
              git log --pretty=format:"- %s" "$PREV"..HEAD
            else
              echo "## Initial release"
            fi
            echo
            echo NOTES_EOF
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.body }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
